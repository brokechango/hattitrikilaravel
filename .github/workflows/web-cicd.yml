name: Web CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  SUPABASE_CLI_VERSION: "2.110.0"
  WRANGLER_VERSION: "4.112.0"

jobs:
  build:
    name: Test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate test application key
        run: php artisan key:generate

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate dependency metadata
        run: composer validate --strict

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Build Vite assets
        run: npm run build

      - name: Run PHP tests
        run: composer test

      - name: Run JavaScript tests
        env:
          LARAVEL_BYPASS_ENV_CHECK: "1"
        run: npm test

      - name: Validate production configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Configure SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY as repository variables."
            exit 1
          fi

      - name: Export Cloudflare Pages artifact
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: https://hattitrikifc.pro
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          SUPABASE_URL: ${{ (github.ref == 'refs/heads/main' && vars.SUPABASE_URL) || 'https://ci.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ (github.ref == 'refs/heads/main' && vars.SUPABASE_PUBLISHABLE_KEY) || 'sb_publishable_ci_only' }}
        run: php scripts/export-static.php dist

      - name: Verify production artifact
        run: node scripts/verify-static-release.mjs --artifact dist

      - name: Reject forbidden production files and credentials
        shell: bash
        run: |
          if find dist -type f \( -name '*.php' -o -name '*.map' -o -name '.env*' \) -print -quit | grep -q .; then
            echo "The production artifact contains a forbidden server or source file."
            exit 1
          fi

          if grep -E -i 'service_role|sb_secret_' dist/config.js; then
            echo "The production artifact contains a forbidden Supabase credential."
            exit 1
          fi

      - name: Upload production artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-production
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Validate preview, migrate, and deploy atomically
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy-production.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download production artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-production
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_PAGES_PROJECT \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Audit Cloudflare project and remember rollback target
        id: cloudflare-audit
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          project="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          if [[ "$(jq -r '.success' <<< "$project")" != "true" ]]; then
            echo "Cloudflare rejected the Pages project audit."
            exit 1
          fi

          production_branch="$(jq -r '.result.production_branch' <<< "$project")"
          if [[ "$production_branch" != "main" ]]; then
            echo "Cloudflare Pages production branch is '${production_branch}', expected 'main'."
            exit 1
          fi

          domains="$(curl --fail --silent --show-error "${auth[@]}" "$api/domains")"
          for required_domain in hattitrikifc.pro www.hattitrikifc.pro
          do
            if ! jq -e --arg domain "$required_domain" \
              '.result[] | select(.name == $domain and .status == "active")' \
              <<< "$domains" > /dev/null
            then
              echo "Cloudflare Pages domain ${required_domain} is not active."
              exit 1
            fi
          done

          deployments="$(curl --fail --silent --show-error "${auth[@]}" "$api/deployments?env=production&per_page=10")"
          previous_id="$(
            jq -r '
              [.result[]
                | select(.environment == "production")
                | select(.latest_stage.status == "success")
              ][0].id // ""
            ' <<< "$deployments"
          )"

          if [[ -z "$previous_id" ]]; then
            echo "No successful production deployment is available for rollback."
            exit 1
          fi

          echo "previous-production-id=${previous_id}" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable artifact to a preview branch
        id: deploy-preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=ci-${{ github.run_id }}-${{ github.run_attempt }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview byte for byte
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-preview.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          node scripts/verify-static-release.mjs \
            --origin "$DEPLOYMENT_URL" \
            --release dist/release.json \
            --attempts 12 \
            --consecutive 2 \
            --delay-ms 3000

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Preview pending Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy send-league-invitation --project-ref "$SUPABASE_PROJECT_REF"

      - name: Promote the verified artifact to Cloudflare Pages production
        id: deploy-production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production release and both hostnames
        id: production-smoke
        continue-on-error: true
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-production.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"

          node scripts/verify-static-release.mjs \
            --origin "$DEPLOYMENT_URL" \
            --release dist/release.json \
            --attempts 12 \
            --consecutive 2 \
            --delay-ms 3000
          node scripts/verify-static-release.mjs \
            --origin https://hattitrikifc.pro \
            --release dist/release.json \
            --attempts 24 \
            --consecutive 3 \
            --delay-ms 10000
          node scripts/verify-static-release.mjs \
            --origin https://www.hattitrikifc.pro \
            --canonical-origin https://hattitrikifc.pro \
            --attempts 12 \
            --consecutive 3 \
            --delay-ms 5000

      - name: Roll back Cloudflare Pages when production verification fails
        if: steps.production-smoke.outcome == 'failure'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PREVIOUS_PRODUCTION_ID: ${{ steps.cloudflare-audit.outputs.previous-production-id }}
        run: |
          rollback_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments/${PREVIOUS_PRODUCTION_ID}/rollback"
          response="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "$rollback_url"
          )"

          if [[ "$(jq -r '.success' <<< "$response")" != "true" ]]; then
            echo "::error title=Rollback failed::Cloudflare rejected the automatic rollback."
            exit 1
          fi

          echo "::warning title=Production rolled back::Release verification failed and Cloudflare Pages was rolled back to ${PREVIOUS_PRODUCTION_ID}."

      - name: Fail the workflow after a production rollback
        if: steps.production-smoke.outcome == 'failure'
        run: |
          echo "::error title=Deployment rejected::The new release failed strict production verification and was rolled back."
          exit 1
