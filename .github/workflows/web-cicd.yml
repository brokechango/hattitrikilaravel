name: Web CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  SUPABASE_CLI_VERSION: "2.110.0"
  WRANGLER_VERSION: "4.112.0"

jobs:
  build:
    name: Test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate test application key
        run: php artisan key:generate

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate dependency metadata
        run: composer validate --strict

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Build Vite assets
        run: npm run build

      - name: Run PHP tests
        run: composer test

      - name: Run JavaScript tests
        env:
          LARAVEL_BYPASS_ENV_CHECK: "1"
        run: npm test

      - name: Validate production configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Configure SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY as repository variables."
            exit 1
          fi

      - name: Export Cloudflare Pages artifact
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: https://hattitrikifc.pro
          SUPABASE_URL: ${{ (github.ref == 'refs/heads/main' && vars.SUPABASE_URL) || 'https://ci.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ (github.ref == 'refs/heads/main' && vars.SUPABASE_PUBLISHABLE_KEY) || 'sb_publishable_ci_only' }}
        run: php scripts/export-static.php dist

      - name: Verify production artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/config.js
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/build/manifest.json
          grep -q 'HATTITRIKI FC' dist/index.html
          grep -q '/build/assets/.*\.js' dist/index.html
          grep -q '/build/assets/.*\.css' dist/index.html
          grep -Eq '/build/assets/.*\.js\?v=[a-f0-9]{12}' dist/index.html
          grep -Eq '/build/assets/.*\.css\?v=[a-f0-9]{12}' dist/index.html
          grep -q 'Content-Security-Policy' dist/_headers
          grep -Fqx '/* /index.html 200' dist/_redirects

          if grep -E -q '(href|src)="https?://[^/"]+/build/assets/' dist/index.html; then
            echo "The production artifact contains hostname-bound Vite asset URLs."
            exit 1
          fi

          if find dist -type f \( -name '*.php' -o -name '*.map' -o -name '.env*' \) -print -quit | grep -q .; then
            echo "The production artifact contains a forbidden server or source file."
            exit 1
          fi

          if grep -E -i 'service_role|sb_secret_' dist/config.js; then
            echo "The production artifact contains a forbidden Supabase credential."
            exit 1
          fi

      - name: Upload production artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-production
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Migrate Supabase and deploy Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download production artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-production
          path: dist

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Validate deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_PAGES_PROJECT \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Preview pending Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy send-league-invitation --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy artifact to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"

          check_origin() {
            local origin="$1"
            local smoke_nonce="$2"
            local html asset_type asset_path content_type

            SMOKE_FAILURE=""

            if ! html="$(
              curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --retry 2 --retry-all-errors \
                --header 'Cache-Control: no-cache' \
                "${origin%/}/?smoke=${smoke_nonce}"
            )"; then
              SMOKE_FAILURE="The application document is unavailable."
              return 1
            fi

            if ! grep -Fq 'HATTITRIKI FC' <<< "$html"; then
              SMOKE_FAILURE="The application marker is missing from the document."
              return 1
            fi

            if grep -E -q '(href|src)="https?://[^/"]+/build/assets/' <<< "$html"; then
              SMOKE_FAILURE="The document contains hostname-bound Vite asset URLs."
              return 1
            fi

            for asset_type in js css
            do
              asset_path="$(
                grep -oE "/build/assets/[^\"]+\\.${asset_type}" <<< "$html" \
                  | sed -n '1p'
              )"

              if [[ -z "$asset_path" ]]; then
                SMOKE_FAILURE="No ${asset_type} asset was found in the document."
                return 1
              fi

              if ! content_type="$(
                curl --fail --location --silent --show-error \
                  --connect-timeout 10 --max-time 30 \
                  --retry 2 --retry-all-errors \
                  --header 'Cache-Control: no-cache' \
                  --output /dev/null --write-out '%{content_type}' \
                  "${origin%/}${asset_path}?smoke=${smoke_nonce}"
              )"; then
                SMOKE_FAILURE="The ${asset_type} asset ${asset_path} is unavailable."
                return 1
              fi

              content_type="${content_type,,}"
              if [[ "$asset_type" == "css" && "$content_type" != text/css* ]]; then
                SMOKE_FAILURE="The CSS asset returned Content-Type '${content_type:-missing}'."
                return 1
              fi

              if [[ "$asset_type" == "js" \
                && "$content_type" != application/javascript* \
                && "$content_type" != text/javascript* ]]; then
                SMOKE_FAILURE="The JavaScript asset returned Content-Type '${content_type:-missing}'."
                return 1
              fi
            done
          }

          for origin in \
            "$DEPLOYMENT_URL" \
            "https://hattitrikifc.pro" \
            "https://www.hattitrikifc.pro"
          do
            smoke_passed=false

            for attempt in {1..12}
            do
              echo "Smoke testing ${origin} (attempt ${attempt}/12)..."

              if check_origin "$origin" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"; then
                smoke_passed=true
                echo "::notice title=Smoke test passed::${origin} passed on attempt ${attempt}."
                break
              fi

              echo "Attempt ${attempt}/12 failed for ${origin}: ${SMOKE_FAILURE}"
              if (( attempt < 12 )); then
                sleep 5
              fi
            done

            if [[ "$smoke_passed" != "true" ]]; then
              echo "::error title=Smoke test failed::${origin} did not become healthy after 12 attempts. ${SMOKE_FAILURE}"
              exit 1
            fi
          done
