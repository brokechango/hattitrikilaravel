services:
  app:
    build:
      context: .
    image: hattitriki-livewire:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: https://hattitrikifc.pro
      APP_CANONICAL_URL: https://hattitrikifc.pro
      SERVER_NAME: hattitrikifc.pro, www.hattitrikifc.pro
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_storage:
  caddy_data:
  caddy_config:
